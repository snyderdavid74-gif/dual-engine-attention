[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dual-engine-attention"
version = "2.0.0"
authors = [
    { name="David L. Snyder" }
]
description = "Adaptive Top-K Attention with Self-Regulating Floor and Effective Dimension Control"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
